[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minidev"
version = "0.1.0"
description = "Installer and configuration layer for Ollama + OpenCode local coding workflows."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "MiniDev" }]
dependencies = [
  "rich>=13.7",
  "tomli>=2.0; python_version < '3.11'",
  "tree-sitter-language-pack>=0.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
]

[project.scripts]
minidev = "minidev.cli:app"

[tool.setuptools]
package-dir = { "" = "cli" }

[tool.setuptools.packages.find]
where = ["cli"]

[tool.setuptools.package-data]
minidev = ["templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
